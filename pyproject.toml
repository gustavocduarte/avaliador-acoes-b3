[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avaliador-acoes-b3"
version = "0.1.0"
description = "Avaliador de ações da B3 por Graham, Bazin e fluxo de caixa descontado (FCD)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# As dependências ficam só no requirements.txt (o arquivo que o Streamlit Community Cloud
# instala); o pacote as lê de lá.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["avaliador_b3"]
ignore_missing_imports = true

[tool.coverage.run]
# Por pasta, e não pelo nome do pacote: o app/main.py é um script que o Streamlit executa (nos
# testes, pelo AppTest) e o coverage só o registra pelo caminho do arquivo.
source = ["src/avaliador_b3"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
