# Atualiza o screener: roda a rodada completa num runner do GitHub, publica o resultado como
# artifact e, se a rodada foi aceita e o screener.csv mudou, commita o screener.csv e o
# macro_referencia.json no master.
name: Atualiza o screener

on:
  # De segunda a sexta às 22:17 UTC, que são 19:17 em Brasília (UTC-3, sem horário de verão),
  # depois do fechamento da B3: os preços do dia já estão no Yahoo. O minuto 17, e não o 0, evita
  # o pico do início da hora, quando o GitHub mais atrasa as execuções agendadas; mesmo assim
  # pode haver atraso de alguns minutos. O GitHub só agenda o que está no branch padrão.
  schedule:
    - cron: "17 22 * * 1-5"
  # Também pode ser disparado à mão: Actions > "Atualiza o screener" > "Run workflow".
  workflow_dispatch:

# Padrão do workflow: só leitura. O job abaixo pede escrita porque é o único que commita.
permissions:
  contents: read

# Impede duas rodadas ao mesmo tempo (cada uma faz ~230 requisições a fontes externas).
concurrency:
  group: atualiza-screener
  cancel-in-progress: false

jobs:
  atualiza:
    # Imagem fixa em vez de ubuntu-latest: o GitHub vai migrar o "latest" para o Ubuntu 26 a partir
    # de 19/10/2026, e a rodada não deve mudar de sistema sem a gente testar. Rever quando o
    # ubuntu-24.04 for descontinuado pelo GitHub.
    runs-on: ubuntu-24.04
    # Escrita no repositório só neste job, para o commit do screener (passo 8). O push feito com
    # o GITHUB_TOKEN não dispara outros workflows (e este só roda por agenda ou à mão).
    permissions:
      contents: write
    # A rodada leva de 5 a 15 minutos; o limite evita um job preso por horas.
    timeout-minutes: 45
    env:
      # O projeto não é um pacote instalável (não há [project] no pyproject.toml): o pytest e o
      # Streamlit já encontram src/ por conta própria (pythonpath e sys.path.insert), e aqui
      # basta apontar o Python para src/ para o `python -m avaliador_b3...` achar o pacote.
      PYTHONPATH: src
      # Garante UTF-8 na saída (acentos do resumo), independentemente do locale do runner.
      PYTHONUTF8: "1"

    steps:
      # 1. Baixa o código do repositório (inclui o screener.csv versionado). O histórico completo
      #    permite o `git pull --rebase` do passo 8 sem problema de clone raso.
      - name: Baixa o repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Instala o Python 3.14 e guarda o cache de downloads do pip entre execuções.
      - name: Instala o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Instala só as dependências do app (sem pytest, ruff e mypy).
      - name: Instala as dependências
        run: python -m pip install -r requirements.txt

      # 4. Chave do cache dos zips da CVM: uma por semana ISO. O app só rebaixa o zip do ano em
      #    preenchimento depois de 7 dias (DIAS_VALIDADE_CACHE_ZIP_CVM_ANO_CORRENTE), então um
      #    cache novo por semana acompanha essa validade e limita o espaço usado.
      - name: Calcula a chave do cache da CVM
        id: semana
        run: echo "chave=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # 5. Restaura os zips da CVM (DFP e ITR, ~67 MB no total, já compactados) da última semana
      #    em que foram salvos, para não baixá-los toda vez. Só os zips: os JSON derivados
      #    (fcf_*, balanco_*) são refeitos a partir deles e não ficam presos a dado velho.
      - name: Restaura o cache da CVM
        id: cache_cvm
        uses: actions/cache/restore@v6
        with:
          path: data/raw/cvm/*.zip
          key: cvm-zips-${{ steps.semana.outputs.chave }}
          restore-keys: cvm-zips-

      # 6. Lista os zips restaurados com a data de modificação. O app decide rebaixar o zip do ano
      #    corrente pela data de modificação do arquivo (cvm.py, _cache_zip_expirado): se a
      #    restauração não preservasse as datas originais, esse zip nunca seria atualizado.
      #    Compare, na primeira e na segunda execução, as datas com as da execução anterior.
      - name: Lista os zips da CVM restaurados
        run: |
          {
            echo "### Zips da CVM depois da restauração do cache"
            echo "Cache exato encontrado: ${{ steps.cache_cvm.outputs.cache-hit }} (chave restaurada: ${{ steps.cache_cvm.outputs.cache-matched-key }})"
            echo "Agora (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo '```'
            ls -l --time-style='+%Y-%m-%d %H:%M:%S' data/raw/cvm/*.zip 2>/dev/null || echo "(nenhum zip em data/raw/cvm)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # 7. Roda a rodada. Sai com 0 se aceita, 1 se rejeitada pela checagem e 2 se houve exceção;
      #    o resumo vai para a tela e para resumo-rodada.txt.
      - name: Roda o screener
        run: python -m avaliador_b3.rodar_screener --resumo resumo-rodada.txt

      # 8. Só se a rodada saiu com 0 (aceita), e só no master: commita o screener.csv e o
      #    macro_referencia.json se o screener.csv mudou. Autor github-actions[bot], sem trailer,
      #    com o resumo da rodada no corpo. Rodada rejeitada (saída 1) ou com exceção (saída 2)
      #    derruba o passo 7, então este não roda e o job termina em falha, sem commit.
      #    Antes do push, `git pull --rebase` incorpora commits novos do master.
      - name: Commita o screener atualizado
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            { echo "### Commit do screener"; echo "Execução fora do master ($GITHUB_REF): nada foi commitado."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --quiet -- data/processed/screener.csv; then
            { echo "### Commit do screener"; echo "O screener.csv não mudou desde a última rodada (por exemplo, feriado): nada foi commitado."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/screener.csv data/processed/macro_referencia.json
          { echo "Atualiza o screener (rodada de $(date -u +%Y-%m-%d))"; echo; cat resumo-rodada.txt; } > "$RUNNER_TEMP/mensagem-commit.txt"
          git commit -F "$RUNNER_TEMP/mensagem-commit.txt"
          git pull --rebase origin master
          git push origin HEAD:master
          { echo "### Commit do screener"; echo "Commit feito no master: $(git rev-parse --short HEAD)"; } >> "$GITHUB_STEP_SUMMARY"

      # 9. Sempre (mesmo se a rodada falhar): mostra na página da execução o resumo da rodada e os
      #    zips da CVM como ficaram depois dela (um zip rebaixado aparece com a data de agora).
      - name: Mostra o resumo na página da execução
        if: always()
        run: |
          {
            echo "### Resumo da rodada"
            if [ -f resumo-rodada.txt ]; then
              echo '```'; cat resumo-rodada.txt; echo '```'
            else
              echo "(a rodada não gerou resumo)"
            fi
            echo "### Zips da CVM depois da rodada"
            echo '```'
            ls -l --time-style='+%Y-%m-%d %H:%M:%S' data/raw/cvm/*.zip 2>/dev/null || echo "(nenhum zip em data/raw/cvm)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 10. Sempre (mesmo se a rodada falhar), mas só se a restauração não achou a chave exata da
      #    semana: salva os zips da CVM no cache. Uma chave já existente não pode ser regravada.
      - name: Salva o cache da CVM
        if: always() && steps.cache_cvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw/cvm/*.zip
          key: cvm-zips-${{ steps.semana.outputs.chave }}

      # 11. Sempre: publica o resumo, o screener.csv e, se existir, o screener.rejeitado.csv.
      #    Numa rodada rejeitada o screener.csv é o anterior, que a rodada não substituiu.
      - name: Publica os arquivos da rodada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screener-${{ github.run_id }}
          path: |
            resumo-rodada.txt
            data/processed/screener.csv
            data/processed/screener.rejeitado.csv
          if-no-files-found: ignore
          retention-days: 14
